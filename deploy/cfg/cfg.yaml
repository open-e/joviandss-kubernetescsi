loglevel  : Info
# logfile : /tmp/csi-log # without it the log goes to standard output
pool      : Pool-0 # pool name that you have created on JovianDSS
endpoint :
  addrs:
    - 192.168.0.100 # only the first address is used
  port: 82
  user: admin # JovianDSS Web/REST user name
  pass: admin # JovianDSS Web/REST user passowrd
  idletimeout: 30s
  tries: 3        # a GET answered without data is sent this many times in all
  retrydelay: 1s  # the pause before it is sent again
iscsi:
  iqn : iqn.csi.2019-04
  addrs:
    - 192.168.0.100 # IP address that would be used to attach volumes over ISCSI
  port: 3260
nfs:
  addrs:
    - 192.168.0.100
